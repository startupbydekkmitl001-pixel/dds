<!doctype html>
<html
  lang="th"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"theme","type":"enum","label":"Theme","default":"light","options":[{"value":"light","label":"Light"},{"value":"dark","label":"Dark"}]},
    {"id":"act2","type":"string","label":"Act 2 clip (Remotion render)","default":"assets/act2-light.mp4"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=2340" />
    <title>Dschool — welcome film (60 fps)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <style>
      @font-face {
        font-family: "DS Trirong";
        src: url("assets/fonts/Trirong_300Light.ttf") format("truetype");
        font-weight: 300;
        font-style: normal;
      }
      @font-face {
        font-family: "DS Trirong";
        src: url("assets/fonts/Trirong_300Light_Italic.ttf") format("truetype");
        font-weight: 300;
        font-style: italic;
      }
      @font-face {
        font-family: "DS Plex Thai";
        src: url("assets/fonts/IBMPlexSansThai_400Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "DS Plex Thai";
        src: url("assets/fonts/IBMPlexSansThai_500Medium.ttf") format("truetype");
        font-weight: 500;
      }
      @font-face {
        font-family: "DS Plex Mono";
        src: url("assets/fonts/IBMPlexMono_500Medium.ttf") format("truetype");
        font-weight: 500;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 2340px;
        overflow: hidden;
        background: #eef0f7;
      }

      /* Tokens (src/theme/tokens.ts). */
      #root {
        --canvas: #eef0f7;
        --text: #1c1d2b;
        --text2: #4f5369;
        --link: #4b40b5;
        --orb-1: #c9c2f2;
        --orb-2: #bcd6f4;
        --orb-3: #c4e8d8;
        --orb-4: #f3d2da;
        --orb-opacity: 0.5;
        --grain-opacity: 0.08;
        --grain-blend: multiply;
        --gold-glow: rgba(255, 214, 72, 0.55);
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--text);
        font-family: "DS Plex Thai", sans-serif;
      }
      #root[data-theme="dark"] {
        --canvas: #0d0e18;
        --text: #f1f1f8;
        --text2: #b1b4ca;
        --link: #b9b1ff;
        --orb-1: #3f3a78;
        --orb-2: #1f4262;
        --orb-3: #1d4a44;
        --orb-4: #4d2c4c;
        --orb-opacity: 0.55;
        --grain-opacity: 0.1;
        --grain-blend: overlay;
        --gold-glow: rgba(255, 206, 60, 0.42);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: var(--grain-opacity);
        mix-blend-mode: var(--grain-blend);
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }

      /* ── Act 1 · the emblem ─────────────────────────────────────────────── */
      #act1 {
        background: var(--canvas);
        overflow: hidden;
      }
      .orb {
        position: absolute;
        width: 1180px;
        height: 1180px;
        border-radius: 50%;
        opacity: 0;
      }
      #o1 { left: -420px; top: -360px; background: radial-gradient(circle, var(--orb-1) 0%, color-mix(in srgb, var(--orb-1) 72%, transparent) 26%, color-mix(in srgb, var(--orb-1) 24%, transparent) 50%, transparent 70%); }
      #o2 { left: 360px; top: 360px; background: radial-gradient(circle, var(--orb-2) 0%, color-mix(in srgb, var(--orb-2) 72%, transparent) 26%, color-mix(in srgb, var(--orb-2) 24%, transparent) 50%, transparent 70%); }
      #o3 { left: -480px; top: 1180px; background: radial-gradient(circle, var(--orb-3) 0%, color-mix(in srgb, var(--orb-3) 72%, transparent) 26%, color-mix(in srgb, var(--orb-3) 24%, transparent) 50%, transparent 70%); }
      #o4 { left: 300px; top: 1620px; background: radial-gradient(circle, var(--orb-4) 0%, color-mix(in srgb, var(--orb-4) 72%, transparent) 26%, color-mix(in srgb, var(--orb-4) 24%, transparent) 50%, transparent 70%); }
      #rays-gl {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 2340px;
      }
      /* The seal and emblem share one "camera" group, so the push-through moves them together. */
      #camera {
        position: absolute;
        inset: 0;
      }
      #disc {
        position: absolute;
        left: 110px;
        top: 630px;
        width: 860px;
        height: 860px;
        border-radius: 50%;
        opacity: 0;
        background: radial-gradient(circle at 36% 28%, #ffffff 0%, #f6f8ff 34%, #e3e9fb 68%, #d0d8f3 100%);
        box-shadow: 0 60px 160px rgba(40, 44, 110, 0.22), inset 0 -14px 40px rgba(110, 120, 200, 0.2);
      }
      #rim {
        position: absolute;
        left: 110px;
        top: 630px;
        width: 860px;
        height: 860px;
        border-radius: 50%;
        --a: 0deg;
        background: conic-gradient(from -90deg, #f6c9dd, #c6d6fb, #c4eedd, #fff1b8, #f6c9dd);
        -webkit-mask-image: radial-gradient(circle closest-side, transparent 0%, transparent 91.5%, #000 93.5%, #000 100%), conic-gradient(from -90deg, #000 var(--a), transparent var(--a));
        -webkit-mask-composite: source-in;
        mask-image: radial-gradient(circle closest-side, transparent 0%, transparent 91.5%, #000 93.5%, #000 100%), conic-gradient(from -90deg, #000 var(--a), transparent var(--a));
        mask-composite: intersect;
      }
      #finial {
        position: absolute;
        width: 220px;
        height: 220px;
        margin: -110px 0 0 -110px;
        border-radius: 50%;
        background: radial-gradient(circle, #fffbe6 0%, #ffe46a 12%, rgba(255, 214, 72, 0.55) 26%, rgba(255, 214, 72, 0) 62%);
        opacity: 0;
      }
      #flare {
        position: absolute;
        width: 760px;
        height: 10px;
        margin: -5px 0 0 -380px;
        border-radius: 5px;
        background: linear-gradient(90deg, transparent, rgba(255, 236, 140, 0.95) 50%, transparent);
        filter: blur(1.5px);
        opacity: 0;
      }
      #emblem {
        position: absolute;
        left: 0;
        top: 0;
        width: 362px;
        height: 512px;
      }
      .layer {
        position: absolute;
        left: 0;
        top: 0;
        width: 362px;
        height: 512px;
        display: block;
      }
      #core-wrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 362px;
        height: 512px;
        --cut: 100%;
        clip-path: inset(0 0 var(--cut) 0);
      }
      #scan {
        position: absolute;
        left: 40px;
        width: 282px;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #ffffff 30%, #ffffff 70%, transparent);
        box-shadow: 0 0 14px 4px rgba(120, 150, 255, 0.75);
        opacity: 0;
      }
      #sheen {
        position: absolute;
        left: 0;
        top: 0;
        width: 362px;
        height: 512px;
        --p: -30%;
        -webkit-mask-image: url("assets/emblem/logo.png");
        mask-image: url("assets/emblem/logo.png");
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        background: linear-gradient(108deg, rgba(255, 255, 255, 0) calc(var(--p) - 10%), rgba(255, 255, 255, 0.7) var(--p), rgba(255, 255, 255, 0) calc(var(--p) + 10%));
      }
      .spark {
        position: absolute;
        width: 40px;
        height: 40px;
        margin: -20px 0 0 -20px;
        opacity: 0;
        filter: drop-shadow(0 0 5px rgba(255, 236, 120, 0.95));
      }
      #brand {
        position: absolute;
        left: 0;
        right: 0;
        top: 1540px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .mask {
        overflow: hidden;
      }
      .mask > * {
        display: block;
      }
      #wordmark {
        rotate: 0.02deg; /* keeps settling text off Chrome's pixel-snapping path (no 1px jump at rest) */
        font: 300 150px/1.18 "DS Trirong";
        letter-spacing: -0.02em;
        color: var(--text);
        padding: 0 10px;
      }
      #wordmark i {
        font-style: italic;
      }
      #school {
        rotate: 0.02deg; /* keeps settling text off Chrome's pixel-snapping path (no 1px jump at rest) */
        font: 500 44px/1.4 "DS Plex Thai";
        color: var(--text2);
        letter-spacing: 0.02em;
        padding-top: 6px;
      }
      #wash {
        position: absolute;
        inset: 0;
        background: var(--canvas);
        opacity: 0;
      }

      /* ── Act 2 · the app (Remotion) ─────────────────────────────────────── */
      #act2 {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 2340px;
        object-fit: cover;
      }

      /* ── Act 3 · finale, over the end of Act 2 ──────────────────────────── */
      #seal-final-wrap {
        position: absolute;
        left: 80px;
        top: 150px;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        overflow: hidden;
        opacity: 0;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.85), 0 16px 40px rgba(20, 24, 60, 0.3);
      }
      #seal-final {
        position: absolute;
        inset: 0;
        width: 132px;
        height: 132px;
        object-fit: cover;
      }
      #burst {
        position: absolute;
        left: 146px;
        top: 216px;
        width: 520px;
        height: 520px;
        margin: -260px 0 0 -260px;
        border-radius: 50%;
        background: repeating-conic-gradient(from 0deg, rgba(255, 210, 60, 0.55) 0deg 3deg, rgba(255, 210, 60, 0) 3deg 20deg);
        -webkit-mask-image: radial-gradient(circle closest-side, transparent 0%, transparent 24%, #000 30%, transparent 72%);
        mask-image: radial-gradient(circle closest-side, transparent 0%, transparent 24%, #000 30%, transparent 72%);
        opacity: 0;
      }
      #finale {
        pointer-events: none;
      }
      #top-mark {
        position: absolute;
        left: 240px;
        top: 150px;
        height: 132px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      #top-word {
        rotate: 0.02deg; /* keeps settling text off Chrome's pixel-snapping path (no 1px jump at rest) */
        font: 300 76px/1.15 "DS Trirong";
        letter-spacing: -0.01em;
      }
      #top-school {
        rotate: 0.02deg; /* keeps settling text off Chrome's pixel-snapping path (no 1px jump at rest) */
        font: 500 30px/1.4 "DS Plex Thai";
        color: var(--text2);
      }
      .final-mask {
        position: absolute;
        left: 80px;
        width: 940px;
        height: 150px;
        overflow: hidden;
      }
      #fm1 {
        top: 372px;
      }
      #fm2 {
        top: 512px;
      }
      .final-line {
        rotate: 0.02deg; /* keeps settling text off Chrome's pixel-snapping path (no 1px jump at rest) */
        display: block;
        padding-top: 8px;
        font: 300 102px/1.4 "DS Trirong";
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      #fl2 {
        font-style: italic;
        color: var(--link);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18.5" data-width="1080" data-height="2340">
      <!-- Act 1 · the emblem (0 – 4.5 s) -->
      <div id="act1" class="clip" data-start="0" data-duration="4.5" data-track-index="0">
        <div id="o1" class="orb"></div>
        <div id="o2" class="orb"></div>
        <div id="o3" class="orb"></div>
        <div id="o4" class="orb"></div>
        <canvas id="rays-gl" width="540" height="1170"></canvas>
        <div id="camera">
          <div id="disc"></div>
          <div id="rim"></div>
          <div id="finial"></div>
          <div id="flare"></div>
          <div id="emblem">
            <img class="layer ray" data-angle="-140.9" src="assets/emblem/ray-00.png" alt="" />
            <img class="layer ray" data-angle="-115.6" src="assets/emblem/ray-01.png" alt="" />
            <img class="layer ray" data-angle="-87.8" src="assets/emblem/ray-02.png" alt="" />
            <img class="layer ray" data-angle="-50.6" src="assets/emblem/ray-03.png" alt="" />
            <img class="layer ray" data-angle="-0.2" src="assets/emblem/ray-04.png" alt="" />
            <img class="layer ray" data-angle="47.5" src="assets/emblem/ray-05.png" alt="" />
            <img class="layer ray" data-angle="86.3" src="assets/emblem/ray-06.png" alt="" />
            <img class="layer ray" data-angle="115.6" src="assets/emblem/ray-07.png" alt="" />
            <img class="layer ray" data-angle="141.6" src="assets/emblem/ray-08.png" alt="" />
            <img id="wheel" class="layer" src="assets/emblem/wheel.png" alt="" />
            <div id="core-wrap"><img class="layer" src="assets/emblem/core.png" alt="" /></div>
            <div id="scan"></div>
            <div id="sheen"></div>
            <svg class="spark" data-x="150" data-y="72" viewBox="-1 -1 2 2"><path d="M0 -1 C.05 -.16 .16 -.05 1 0 C.16 .05 .05 .16 0 1 C-.05 .16 -.16 .05 -1 0 C-.16 -.05 -.05 -.16 0 -1Z" fill="#fff" /></svg>
            <svg class="spark" data-x="256" data-y="190" viewBox="-1 -1 2 2"><path d="M0 -1 C.05 -.16 .16 -.05 1 0 C.16 .05 .05 .16 0 1 C-.05 .16 -.16 .05 -1 0 C-.16 -.05 -.05 -.16 0 -1Z" fill="#fff" /></svg>
            <svg class="spark" data-x="142" data-y="408" viewBox="-1 -1 2 2"><path d="M0 -1 C.05 -.16 .16 -.05 1 0 C.16 .05 .05 .16 0 1 C-.05 .16 -.16 .05 -1 0 C-.16 -.05 -.05 -.16 0 -1Z" fill="#fff" /></svg>
          </div>
        </div>
        <div id="brand">
          <div class="mask"><div id="wordmark">D<i>school</i></div></div>
          <div class="mask"><div id="school">โรงเรียนราชดำริ</div></div>
        </div>
        <div id="wash"></div>
        <div class="grain"></div>
      </div>

      <!-- Act 2 · the app, rendered in Remotion (4.4 – 18.5 s). Its first frames are the flat canvas the push-through ends on. -->
      <video id="act2" class="clip" data-start="4.4" data-duration="14.1" data-track-index="1" data-var-src="act2" src="assets/act2-light.mp4" muted playsinline></video>

      <!-- Act 3 · finale over the end of Act 2 (14.5 – 18.5 s) -->
      <div id="burst"></div>
      <div id="seal-final-wrap">
        <video id="seal-final" class="clip" data-start="14.5" data-duration="4" data-track-index="3" src="assets/seal60.mp4" muted playsinline></video>
      </div>
      <div id="finale" class="clip" data-start="14.5" data-duration="4" data-track-index="2">
        <div id="top-mark">
          <div class="mask"><div id="top-word">D<i style="font-style: italic">school</i></div></div>
          <div class="mask"><div id="top-school">โรงเรียนราชดำริ</div></div>
        </div>
        <div id="fm1" class="final-mask"><span id="fl1" class="final-line">ทุกเรื่องในโรงเรียน</span></div>
        <div id="fm2" class="final-mask"><span id="fl2" class="final-line">ในแอปเดียว</span></div>
      </div>
    </div>

    <script>
      (function () {
        const root = document.getElementById("root");
        const vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
        const dark = vars.theme === "dark";
        root.dataset.theme = dark ? "dark" : "light";

        gsap.registerPlugin(CustomEase);
        // The app's curves (src/theme/motion.ts), plus a smooth ease-in for the push-through.
        CustomEase.create("dsBase", "M0,0 C0.52,0.01 0,1 1,1");
        CustomEase.create("dsOut", "M0,0 C0.16,1 0.3,1 1,1");
        CustomEase.create("dsIn", "M0,0 C0.6,0 0.86,0.3 1,1");

        // ── Emblem geometry: emblem pixel (182,254) (the artwork's centre) sits at (540,1060). ──
        const E = { cx: 182, cy: 254, x: 540, y: 1060, big: 2.1, fit: 1.55 };
        const PIVOT = { x: 181, y: 100 }; // the finial, where the rays fan from
        const toScreen = (px, py, s) => ({ x: E.x + (px - E.cx) * s, y: E.y + (py - E.cy) * s });
        const finial = toScreen(PIVOT.x, PIVOT.y - 22, E.big);

        const emblem = document.getElementById("emblem");
        gsap.set(emblem, { x: E.x - E.cx, y: E.y - E.cy, transformOrigin: E.cx + "px " + E.cy + "px" });
        gsap.set("#finial", { left: finial.x, top: finial.y });
        gsap.set("#flare", { left: finial.x, top: finial.y });
        gsap.set("#camera", { transformOrigin: "540px 1060px" });
        document.querySelectorAll(".spark").forEach((s) => gsap.set(s, { left: +s.dataset.x, top: +s.dataset.y }));

        // ── WebGL light rays from the finial (deterministic: drawn from timeline time only). ──
        const cv = document.getElementById("rays-gl");
        const gl = cv.getContext("webgl2", { premultipliedAlpha: true, alpha: true, preserveDrawingBuffer: true });
        const vs = "#version 300 es\nvoid main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.0-1.0,0.0,1.0);}";
        const fs = `#version 300 es
          precision highp float;
          uniform vec2 uRes; uniform vec2 uSrc; uniform float uT; uniform float uAmp; uniform vec3 uCol;
          out vec4 o;
          void main(){
            vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
            vec2 d = p - uSrc;
            float r = length(d) / uRes.y;
            float a = atan(d.y, d.x);
            // Integer multiples of the angle, so the pattern has no seam where atan wraps.
            float s1 = 0.5 + 0.5 * sin(a * 14.0 + uT * 0.55);
            float s2 = 0.5 + 0.5 * sin(a * 23.0 - uT * 0.8 + 1.3);
            float s3 = 0.5 + 0.5 * sin(a * 37.0 + uT * 1.1 + 2.1);
            float rays = pow(s1 * 0.55 + s2 * 0.3 + s3 * 0.15, 3.2);
            float fall = exp(-r * 2.4);
            float core = exp(-r * 10.0);
            float v = uAmp * (rays * fall * 0.95 + core * 0.9);
            o = vec4(uCol * v, v);
          }`;
        const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
        const prog = gl.createProgram();
        gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
        gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(prog);
        gl.useProgram(prog);
        gl.viewport(0, 0, cv.width, cv.height);
        gl.uniform2f(gl.getUniformLocation(prog, "uRes"), cv.width, cv.height);
        gl.uniform2f(gl.getUniformLocation(prog, "uSrc"), finial.x / 2, finial.y / 2);
        gl.uniform3f(gl.getUniformLocation(prog, "uCol"), 1.0, dark ? 0.8 : 0.74, dark ? 0.26 : 0.16);
        const uT = gl.getUniformLocation(prog, "uT");
        const uAmp = gl.getUniformLocation(prog, "uAmp");
        const light = { t: 0, amp: 0 };
        const drawRays = () => {
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.uniform1f(uT, light.t);
          gl.uniform1f(uAmp, light.amp * (dark ? 0.9 : 0.62));
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        };
        drawRays();

        const tl = gsap.timeline({ paused: true });

        // Light clock and intensity: rays rise with the sunburst and ebb as the seal forms.
        tl.fromTo(light, { t: 0 }, { t: 4.5, duration: 4.5, ease: "none", immediateRender: false, onUpdate: drawRays }, 0);
        tl.fromTo(light, { amp: 0 }, { amp: 1, duration: 1.1, ease: "sine.out", immediateRender: false, onUpdate: drawRays }, 0.35);
        tl.fromTo(light, { amp: 1 }, { amp: 0.32, duration: 0.9, ease: "sine.inOut", immediateRender: false, onUpdate: drawRays }, 2.4);
        tl.fromTo(light, { amp: 0.32 }, { amp: 0, duration: 0.6, ease: "sine.in", immediateRender: false, onUpdate: drawRays }, 3.5);

        // Ambient light blooms in underneath.
        ["#o1", "#o2", "#o3", "#o4"].forEach((o, i) => {
          tl.fromTo(o, { opacity: 0, scale: 0.72 }, { opacity: dark ? 0.55 : 0.5, scale: 1, duration: 1.6, ease: "dsOut" }, 0.2 + i * 0.1);
        });

        // 1 · A point of light: the finial.
        tl.fromTo("#finial", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.8)" }, 0.12);
        tl.fromTo("#flare", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.22);
        tl.fromTo("#flare", { scaleX: 1, opacity: 1 }, { scaleX: 1.3, opacity: 0, duration: 0.5, ease: "power2.in", immediateRender: false }, 0.52);

        // Emblem appears big, then settles into the seal.
        tl.fromTo(emblem, { scale: E.big }, { scale: E.fit, duration: 0.95, ease: "dsBase", immediateRender: true }, 2.35);

        // 2 · Sunrise: the rays fan out from the finial, centre first.
        const rays = Array.from(document.querySelectorAll(".ray")).sort((a, b) => Math.abs(+a.dataset.angle) - Math.abs(+b.dataset.angle));
        rays.forEach((ray, i) => {
          const at = 0.42 + i * 0.07;
          tl.fromTo(ray, { scale: 0.15, opacity: 0, transformOrigin: PIVOT.x + "px " + PIVOT.y + "px" },
            { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.5)" }, at);
          tl.fromTo(ray, { filter: "brightness(1.9) drop-shadow(0 0 10px rgba(255,236,100,0.95))" },
            { filter: "brightness(1) drop-shadow(0 0 0px rgba(255,236,100,0))", duration: 0.8, ease: "sine.out" }, at);
        });
        tl.fromTo("#finial", { scale: 1, opacity: 1 }, { scale: 0.45, opacity: 0, duration: 0.6, ease: "sine.inOut", immediateRender: false }, 1.2);

        // 3 · The crown draws down behind a light line; the wheel turns into place.
        tl.fromTo("#core-wrap", { "--cut": "100%" }, { "--cut": "0%", duration: 1.05, ease: "power2.inOut" }, 1.0);
        tl.fromTo("#scan", { y: 60 }, { y: 470, duration: 1.05, ease: "power2.inOut" }, 1.0);
        tl.fromTo("#scan", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none", immediateRender: false }, 1.0);
        tl.fromTo("#scan", { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "none", immediateRender: false }, 1.89);
        tl.fromTo("#wheel", { rotation: -150, scale: 0.82, opacity: 0, transformOrigin: "178px 409px" },
          { rotation: 0, scale: 1, opacity: 1, duration: 1.0, ease: "dsOut" }, 1.5);

        // 4 · The pearl seal forms around it, its prism rim drawing round.
        tl.fromTo("#disc", { scale: 0.62, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.95, ease: "dsOut" }, 2.35);
        tl.fromTo("#rim", { "--a": "0deg" }, { "--a": "360deg", duration: 1.0, ease: "power2.inOut" }, 2.55);
        tl.fromTo("#sheen", { "--p": "-30%" }, { "--p": "130%", duration: 1.0, ease: "power2.inOut", immediateRender: false }, 2.75);
        document.querySelectorAll(".spark").forEach((s, i) => {
          const at = 2.55 + i * 0.2;
          tl.fromTo(s, { scale: 0, rotation: -25, opacity: 0 }, { scale: 1, rotation: 20, opacity: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, at);
          tl.fromTo(s, { scale: 1, rotation: 20, opacity: 1 }, { scale: 0, rotation: 70, opacity: 0, duration: 0.42, ease: "power2.in", immediateRender: false }, at + 0.3);
        });

        // 5 · The name.
        tl.fromTo("#wordmark", { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: "dsOut" }, 2.7);
        tl.fromTo("#school", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "dsOut" }, 2.85);

        // 6 · Push through the seal into the app: accelerate, blur with speed, wash to the canvas.
        tl.fromTo(["#wordmark", "#school"], { yPercent: 0 }, { yPercent: -110, duration: 0.35, ease: "power2.in", immediateRender: false }, 3.45);
        tl.fromTo("#camera", { scale: 1, filter: "blur(0px)" }, { scale: 13, filter: "blur(12px)", duration: 0.95, ease: "dsIn", immediateRender: false }, 3.45);
        tl.fromTo("#wash", { opacity: 0 }, { opacity: 1, duration: 0.42, ease: "sine.inOut" }, 3.96);

        // ── Act 3 · finale over the end of Act 2 ──
        tl.fromTo("#fl1", { yPercent: 105 }, { yPercent: 0, duration: 0.85, ease: "dsOut" }, 14.6);
        tl.fromTo("#fl2", { yPercent: 105 }, { yPercent: 0, duration: 0.85, ease: "dsOut" }, 14.75);
        tl.fromTo("#seal-final-wrap", { scale: 0.4, opacity: 0, rotation: -40 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.9, ease: "back.out(1.7)" }, 14.9);
        tl.fromTo("#burst", { scale: 0.5, opacity: 0, rotation: 0 }, { scale: 1.15, opacity: 1, rotation: 25, duration: 0.45, ease: "power2.out" }, 15);
        tl.fromTo("#burst", { scale: 1.15, opacity: 1, rotation: 25 }, { scale: 1.4, opacity: 0, rotation: 45, duration: 0.7, ease: "power2.in", immediateRender: false }, 15.45);
        tl.fromTo("#top-word", { yPercent: 110 }, { yPercent: 0, duration: 0.75, ease: "dsOut" }, 15.05);
        tl.fromTo("#top-school", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "dsOut" }, 15.18);

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
