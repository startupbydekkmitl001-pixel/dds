<!doctype html>
<html
  lang="th"
  data-composition-variables='[
    {"id":"scene","type":"enum","label":"Tile","default":"attendance","options":[{"value":"attendance","label":"Attendance"},{"value":"behavior","label":"Behavior"},{"value":"leave","label":"Leave"},{"value":"assessments","label":"Assessments"}]},
    {"id":"theme","type":"enum","label":"Theme","default":"light","options":[{"value":"light","label":"Light"},{"value":"dark","label":"Dark"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=864, height=480" />
    <title>Dschool — tile loops</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 864px;
        height: 480px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* Drawn at 2x and downscaled by the compositor: a free 2x2 supersample. */
      #gl {
        position: absolute;
        inset: 0;
        width: 864px;
        height: 480px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="tiles" data-start="0" data-duration="6" data-width="864" data-height="480">
      <canvas id="gl" class="clip" width="1728" height="960" data-start="0" data-duration="6" data-track-index="0"></canvas>
    </div>
    <script src="shaders/common.js"></script>
    <script src="shaders/attendance.js"></script>
    <script src="shaders/behavior.js"></script>
    <script src="shaders/leave.js"></script>
    <script src="shaders/assessments.js"></script>
    <script src="main.js"></script>
    <script>
      // The only clock: a paused timeline whose position is the loop phase. HyperFrames seeks it.
      const clock = { p: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { p: 0 }, { p: 1, duration: 6, ease: "none", immediateRender: false, onUpdate: () => window.TILE.draw(clock.p) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["tiles"] = tl;
    </script>
  </body>
</html>
