# Builds an unsigned iPhone app (.ipa) on GitHub's macOS runners, for sideloading with AltStore or
# Sideloadly, which sign it with your own (free) Apple ID. No Apple Developer account is involved.
#
# Runs on every push that touches the app, and on demand from Actions → "iOS IPA" → Run workflow.
# Each successful build replaces the "ios-latest" pre-release, so the newest .ipa is always at
# https://github.com/<owner>/<repo>/releases/download/ios-latest/Dschool.ipa
# (it's also kept for 30 days as a run artifact).
name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md', 'docs/**', 'motion/**']

# A newer push to the same branch makes an older, still-running build pointless.
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to publish the ios-latest release

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # ios/ isn't committed (Continuous Native Generation): generate it from app.json and the config plugins.
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: 1

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build the app (Release, unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "${WORKSPACE%.xcworkspace}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log

      - name: Show the build log on failure
        if: failure()
        run: grep -E 'error:|\*\* BUILD' ios/xcodebuild.log | head -n 80; tail -n 150 ios/xcodebuild.log || true

      - name: Package Dschool.ipa
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry Dschool.ipa Payload)
          ls -lh dist/Dschool.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Dschool-ipa
          path: dist/Dschool.ipa
          retention-days: 30

      - name: Publish as the ios-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest dist/Dschool.ipa \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dschool for iPhone (latest build)" \
            --notes "Unsigned build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Install it with AltStore (My Apps → +) or Sideloadly using your own Apple ID; with a free Apple ID, refresh it every 7 days."
